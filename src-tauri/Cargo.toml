[package]
name = "vaultforge-wallet"
version = "0.5.0"
description = "A local-first crypto wallet desktop app"
authors = ["VaultForge"]
edition = "2024"

[lib]
name = "vaultforge_wallet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
futures-util = "0.3.34"
aes-gcm = "0.11.1"
argon2 = "0.5.3"
base64 = "0.23.1"
blake2 = "0.10.6"
wincode = "0.6.3"
chrono = { version = "0.4.45", features = ["serde"] }
hex = "0.4.3"
rand = "0.10.3"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
solana-address-lookup-table-interface = { version = "4.0.0", features = ["bytemuck", "wincode"] }
solana-hash = "4.7.0"
solana-instruction = "3.5.1"
solana-keypair = "3.1.2"
solana-message = { version = "4.6.0", features = ["wincode"] }
solana-pubkey = "4.4.0"
solana-signer = "3.0.1"
solana-system-interface = { version = "3.3.0", features = ["wincode"] }
solana-transaction = { version = "4.3.0", features = ["wincode"] }
spl-associated-token-account-interface = "2.0.0"
spl-token-interface = "3.0.0"
spl-token-2022-interface = "3.1.2"
spl-token-metadata-interface = "1.0.1"
sha2 = { version = "0.11.1", features = ["zeroize"] }
bip39 = "2.2.2"
bip32 = { version = "0.6.0", features = ["alloc"] }
hmac = { version = "0.13.0", features = ["zeroize"] }
k256 = { version = "0.14.0", features = ["ecdsa"] }
rlp = "0.6.1"
sha3 = "0.12.0"
ripemd = "0.2.0"
bs58 = { version = "0.5.1", features = ["check"] }
bech32 = "0.12.0"
ed25519-dalek = "2.2.0"
zeroize = { version = "1.9.1", features = ["zeroize_derive"] }
tokio = { version = "1.54.1", features = ["rt", "sync", "time"] }
tauri = { version = "2.12.5", features = ["image-png"] }
# cookie 0.18.1 does not compile against time 0.3.52's parsing API.
time = "=0.3.55"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-opener = "2.7.2"
tauri-plugin-process = "2.4.0"
xrpl-rust = { version = "=1.3.0", default-features = false, features = ["core"] }

[target.'cfg(target_os = "linux")'.dependencies]
gdk = "0.18.2"
gtk = "0.18.2"
webkit2gtk = "2.0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-web-kit = { version = "0.3.2", default-features = false, features = [
  "objc2-app-kit",
  "WKWebView",
] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.5.4"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.14.0"
