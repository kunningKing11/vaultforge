commit-msg:
  parallel: false
  commands:
    enforce-commit-message-line-length:
      run: bash scripts/check-commit-message.sh {1}
      priority: 1
      fail_text: "Commit blocked: keep every commit-message line to 72 characters or fewer."
    run-fast-checks:
      run: bun run hooks:check -- commit
      priority: 2
      fail_text: "Commit blocked: one or more quality checks failed. See the summary above."

pre-push:
  jobs:
    - name: run full Rust validation
      run: bun run hooks:check -- push
      fail_text: "Push blocked: one or more Rust validation checks failed. See the summary above."
